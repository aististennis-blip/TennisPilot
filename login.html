<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>
  Login — TennisPilot
</title>

<link
  rel="stylesheet"
  href="style.css">

</head>


<body class="auth-page">


<div class="auth-box">


<a
  class="brand center"
  href="index.html">

  <span class="logo">
    TP
  </span>

  <span>
    TennisPilot
  </span>

</a>


<div class="tabs">

  <button
    class="tab active"
    data-mode="login">

    Log In

  </button>


  <button
    class="tab"
    data-mode="signup">

    Sign Up

  </button>

</div>


<div class="role-row">

  <button
    class="role active"
    data-role="coach">

    Coach

  </button>


  <button
    class="role"
    data-role="player">

    Player

  </button>

</div>


<form id="authForm">


<!-- FULL NAME IS HIDDEN DURING LOGIN.
     SCRIPT.JS WILL SHOW IT WHEN SIGNING UP. -->

<label
  id="nameLabel"
  class="hidden">

  Full name

  <input
    id="name"
    autocomplete="name"
  >

</label>


<label>

  Email

  <input
    id="email"
    type="email"
    autocomplete="email"
    required
  >

</label>


<label>

  Password

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    required
  >

</label>


<label
  id="confirmWrap"
  class="hidden">

  Confirm password

  <input
    id="confirm"
    type="password"
    autocomplete="new-password"
  >

</label>


<label
  id="codeWrap"
  class="hidden">

  Coach connection code

  <input
    id="coachCode"
    placeholder="ABC123"
    maxlength="6"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    style="text-transform:uppercase"
  >

</label>


<p
  id="passwordHint"
  class="hint hidden">

  8+ characters, one uppercase letter,
  one number, and one special symbol.

</p>


<button
  class="btn full"
  id="submitBtn">

  Log In

</button>


<p
  id="authMessage"
  class="message">

</p>


</form>


<a
  class="back"
  href="index.html">

  ← Back to home

</a>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="script.js"></script>


</body>
</html>
