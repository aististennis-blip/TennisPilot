<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — TennisPilot</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main class="auth-wrap">

    <div class="auth-card">


        <a class="brand center" href="index.html">

            <span class="logo">
                TP<span>•</span>
            </span>

            <span>
                TennisPilot
                <small>Train smarter. Coach better.</small>
            </span>

        </a>


        <div id="roleStep">

            <div class="eyebrow">
                WELCOME
            </div>

            <h1>
                How will you use TennisPilot?
            </h1>

            <p class="muted">
                Choose your account type.
            </p>


            <div class="role-grid">

                <button
                    class="role-card"
                    onclick="chooseRole('coach')"
                >

                    <span>👨‍🏫</span>

                    <b>
                        I'm a Coach
                    </b>

                    <small>
                        Manage players, matches and training.
                    </small>

                </button>


                <button
                    class="role-card"
                    onclick="chooseRole('player')"
                >

                    <span>🎾</span>

                    <b>
                        I'm a Player
                    </b>

                    <small>
                        Log matches and follow my coach's plan.
                    </small>

                </button>

            </div>

        </div>


        <form
            id="loginForm"
            class="hidden"
            onsubmit="demoLogin(event)"
        >

            <button
                type="button"
                class="backlink"
                onclick="backRole()"
            >
                ← Change role
            </button>


            <div class="eyebrow">
                ACCOUNT
            </div>


            <h1 id="loginTitle">
                Create your account
            </h1>


            <label>

                Name

                <input
                    id="name"
                    required
                    placeholder="Your name"
                >

            </label>


            <label>

                Email

                <input
                    type="email"
                    required
                    placeholder="you@example.com"
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    required
                    placeholder="••••••••"
                >

            </label>


            <div id="codeWrap" class="hidden">

                <label>

                    Coach Connection Code

                    <span class="optional">
                        optional
                    </span>

                    <input
                        id="coachCode"
                        placeholder="Example: MYK7P2"
                    >

                </label>


                <p class="hint">

                    Enter your coach's code to request
                    a connection.

                </p>

            </div>


            <button
                class="btn primary full"
                type="submit"
            >

                Continue

            </button>

        </form>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
